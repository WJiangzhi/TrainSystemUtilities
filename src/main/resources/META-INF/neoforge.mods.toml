modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"
[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[mixins]]
config = "trainsystemutilities.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "trainsystemutilitieslogo.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

# CROSS-REL-001 (2026-07-17): 下限は当初「hard 参照 API の初出版」だった (WikiPrebuild/MantaAnim
# → 1.0.2、1.0.6 から MantaImage hard 参照 → 1.0.7)。
# 2026-07-19 改訂: 下限 = 内包 Manta の版 (gradle.properties の manta_version が単一の正、
# processResources が展開)。全 consumer がこの規約に従うと、新旧 mod 混在時に古い内包 Manta が
# range 共通部分から脱落し、最新の内包 Manta が決定的に選ばれる。古い mod は Manta の 2.0 未満
# binary compatibility の上で動く。下回ると NoClassDefFoundError になる。
[[dependencies.${mod_id}]]
    modId = "manta"
    type = "required"
    versionRange = "[${manta_version},2)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neo_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "create"
    type = "required"
    versionRange = "[0.5,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "geckolib"
    type = "required"
    versionRange = "[4.7,)"
    ordering = "AFTER"
    side = "BOTH"
